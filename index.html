<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Navigonomic</title>
  <style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

body {
    background-color: #15202b;
    color: #ffffff;
    display: flex;
    justify-content: center;
    min-height: 100vh;
    overflow-x: hidden;
}

small {
    color: #ffffff;
    display: flex;
    justify-content: center;
    min-height: 100vh;
    overflow-x: hidden;
}

.brand-container {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 5px;
}

.brand-logo {
    width: 40px;
    height: 40px;
    -webkit-user-select: none;
    user-select: none;
    pointer-events: none;
}

.btn {
    background-color: #1da1f2;
    color: white;
    border: none;
    padding: 12px 20px;
    border-radius: 9999px;
    font-size: 1rem;
    font-weight: bold;
    cursor: pointer;
    width: 100%;
    transition: background-color 0.2s;
}

.btn:hover {
    background-color: #1a91da;
}

.app-hidden {
    display: none !important;
}

#app-container {
    width: 100%;
    max-width: 600px;
    border-left: 1px solid #38444d;
    border-right: 1px solid #38444d;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
}

.app-header {
    padding: 15px 20px;
    border-bottom: 1px solid #38444d;
    background-color: rgba(21, 32, 43, 0.85);
    backdrop-filter: blur(5px);
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.brand-title {
    font-size: 1.2rem;
    color: #1da1f2;
    margin: 0;
}

.brand-sub {
    font-size: 0.75rem;
    color: #8899a6;
}
  </style>
</head>
<body>
  <header class="app-header">
        <div class="brand-container">
            <img src="logo.png" alt="Navigonomic Logo" class="brand-logo">
            <h2 class="brand-title">Navigonomic</h2>
        </div>
        <span class="brand-sub">The social media that uses AI</span>
  </header>
  <p>Navigonomic is a social media that uses AI, and you watch what happens!</p><br>
  <small style="color: rgba(255, 255, 255, 0.5);">Note: this isn't actually a social media, it's a horror game.</small>
</body>
</html>
